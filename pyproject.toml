[tool.ruff]
line-length = 110

builtins = [
	# translation lookup
	"_",
	# translation lookup
	"ngettext",
	# translation lookup
	"pgettext",
	# translation lookup
	"npgettext",
]

include = [
	"*.py",
	"sconstruct",
]

exclude = [
	".git",
	"__pycache__",
]

[tool.ruff.format]
indent-style = "tab"

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint]
ignore = [
	# indentation contains tabs
	"W191",
	# lower snake case module names, we use lowerCamelCase instead
	"N999",
]
extend-unsafe-fixes = [
	# Sort imports
	"I001",
]
logger-objects = ["logHandler.log"]

[tool.ruff.lint.per-file-ignores]
# sconstruct contains many inbuilt functions not recognised by the lint,
# so ignore F821.
"sconstruct" = ["F821"]

[tool.pyright]
# The Python NVDA stable runs on. Stated rather than inferred: pyright otherwise
# takes it from whichever interpreter it finds first on PATH, so the version this
# add-on is checked against would depend on the machine it is checked on.
pythonVersion = "3.13"
pythonPlatform = "Windows"
typeCheckingMode = "strict"

include = [
	"**/*.py",
]

exclude = [
	"sconstruct",
	".git",
	"__pycache__",
	# When excluding concrete paths relative to a directory,
	# not matching multiple folders by name e.g. `__pycache__`,
	# paths are relative to the configuration file.
]

# Tell pyright where to load python code from.
# NVDA's own modules (api, config, gui, winUser and the rest) live in the `source`
# directory of an NVDA source checkout. There is deliberately none on this list:
# `reportMissingImports` is off instead, so pyright treats every one of them as
# unknown and still checks everything this add-on states for itself, which is what
# the annotations are for. Add a checkout here to check the other side as well:
#	"../nvda/source",
extraPaths = [
	"./addon",
]

# General config
analyzeUnannotatedFunctions = true
deprecateTypingAliases = true

# Stricter typing
strictParameterNoneValue = true
strictListInference = true
strictDictionaryInference = true
strictSetInference = true

# Compliant rules
reportAbstractUsage = true
reportAssertAlwaysTrue = true
reportAssertTypeFailure = true
reportAssignmentType = true
reportCallInDefaultInitializer = true
reportCallIssue = true
reportConstantRedefinition = true
reportDuplicateImport = true
reportFunctionMemberAccess = true
reportGeneralTypeIssues = true
reportImplicitStringConcatenation = true
reportIncompatibleMethodOverride = true
reportIncompatibleVariableOverride = true
reportIncompleteStub = true
reportInconsistentConstructor = true
reportInconsistentOverload = true
reportInvalidStringEscapeSequence = true
reportInvalidStubStatement = true
reportInvalidTypeArguments = true
reportInvalidTypeForm = true
reportInvalidTypeVarUse = true
reportMatchNotExhaustive = true
reportMissingImports = false
reportMissingModuleSource = true
reportNoOverloadImplementation = true
reportOperatorIssue = true
reportOptionalCall = true
reportOptionalContextManager = true
reportOptionalIterable = true
reportOptionalMemberAccess = true
reportOptionalOperand = true
reportOptionalSubscript = true
reportOverlappingOverload = true
reportPossiblyUnboundVariable = true
reportPrivateImportUsage = true
reportPropertyTypeMismatch = true
reportRedeclaration = true
reportReturnType = true
reportSelfClsParameterName = true
reportTypeCommentUsage = true
reportTypedDictNotRequiredAccess = true
reportUnboundVariable = true
reportUndefinedVariable = true
reportUnhashable = true
reportUninitializedInstanceVariable = true
reportUnknownLambdaType = true
reportUnnecessaryCast = true
reportUnnecessaryComparison = true
reportUnnecessaryContains = true
reportUnnecessaryIsInstance = true
reportUnnecessaryTypeIgnoreComment = true
reportUnsupportedDunderAll = true
reportUntypedClassDecorator = true
reportUntypedNamedTuple = true
reportUnusedClass = true
reportUnusedCoroutine = true
reportUnusedExcept = true
reportUnusedExpression = true
reportUnusedFunction = true
reportUnusedImport = true
reportUnusedVariable = true
reportWildcardImportFromLibrary = true

reportDeprecated = true

# Can be enabled by generating type stubs for modules via pyright CLI
reportMissingTypeStubs = false

# Bad rules
# These are sorted alphabetically and should be enabled and moved to compliant rules section when resolved.
# NVDA turns all of these off for its own source as well. They are not failings of
# this add-on: NVDA and wxPython are largely unannotated, so anything reaching into
# either is of an unknown type, and the idioms both of them are built on (binding an
# event, calling the next handler in a chain, overriding a hook) trip the rest.
# These are measured rather than reasoned: pyright is run over this add-on with
# `reportMissingImports` off, and each rule below is one that only ever fired on
# what that leaves unresolved. That is NVDA alone; wxPython ships type stubs and
# is checked like any other library, so nothing here is turned off on its account.

# Everything NVDA or wx hands back is of an unknown type to a checker.
reportUnknownArgumentType = false
reportUnknownMemberType = false
reportUnknownParameterType = false
reportUnknownVariableType = false
reportMissingParameterType = false
reportMissingTypeArgument = false
reportAttributeAccessIssue = false
reportArgumentType = false
reportIndexIssue = false

# Idioms of NVDA and wx: a bound event handler returns nothing anyone reads, a hook
# overrides a base class method that is not marked as overridable, and a settings
# panel implements makeSettings and onSave without calling up to the base class.
reportUnusedCallResult = false
reportImplicitOverride = false
reportMissingSuperCall = false

# The add-on reaches into the gesture map of NVDA's global commands object, which is
# the only way to take a wrapper back off a built-in command. See sleepMode.py.
reportPrivateUsage = false

# Every class this add-on puts on screen derives from one of NVDA's, and its one
# command and the two window-enumeration callbacks are declared with NVDA's own
# decorators. None of them is annotated.
reportUntypedBaseClass = false
reportUntypedFunctionDecorator = false

# Every module here reaches its siblings through the package it is in
# (`from . import addonConfig`), which is how a package is ordinarily written and
# which this rule counts as a cycle. There is nothing else behind what it reports.
reportImportCycles = false
